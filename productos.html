<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Productos | NDB Sanitarios</title><link rel="stylesheet" href="css/estilos.css"></head><body>
<div class="promo-bar">📦 Catálogo con stock administrado por NDB</div><header class="header"><div class="topbar"><button class="hamb" onclick="toggleMobile()">☰</button><a class="brand" href="index.html"><img src="img/logo.jpeg"><div><h1>NDB Sanitarios</h1><small>Productos</small></div></a><div class="search"><input id="search" placeholder="Buscar nombre, código o marca..." oninput="renderProducts()"><button>⌕</button></div><div class="actions"><a href="login.html" class="btn btn-light">Mi cuenta</a><a href="carrito.html" class="btn btn-red cart-link">🛒 <span class="cart-count">0</span></a></div></div></header>
<div id="mobileMenu" class="mobile-menu"><div class="mobile-panel"><button class="btn btn-red" onclick="toggleMobile()">Cerrar ×</button><a href="index.html">Inicio</a><a href="productos.html">Productos</a><a href="carrito.html">Carrito</a><a href="login.html">Mi cuenta</a></div></div>
<main class="container"><section class="card filters" aria-label="Filtros del catálogo">
  <div class="filter-group"><label for="brandFilter">Marca</label><select id="brandFilter" class="field" onchange="renderProducts()"><option value="Todas">Todas las marcas</option></select></div>
  <div class="filter-group"><label for="categoryFilter">Tipo</label><select id="categoryFilter" class="field" onchange="renderProducts()"><option value="Todos">Todos los tipos</option></select></div>
  <label class="stock-check"><input id="stockFilter" type="checkbox" onchange="renderProducts()"> <span>Solo con stock</span></label>
</section><section class="card"><div class="section-title"><div><h2>Catálogo</h2><p class="muted">Buscá por nombre, código, marca o tipo de producto.</p></div></div><hr class="linea-roja"><div id="products" class="product-grid"></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="js/config.js"></script><script src="js/firebase.js"></script><script src="js/app.js"></script></body></html>
