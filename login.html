<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login - B&P</title><link rel="stylesheet" href="css/estilos.css"></head><body><main class="container"><section class="card login"><img src="img/logo.jpeg"><h2>Inicio de sesión</h2><p class="muted">Ingresá como cliente o administrador.</p><br><select id="rol" class="field"><option value="cliente">Cliente</option><option value="admin">Administrador</option></select><input id="user" class="field" placeholder="Usuario"><input id="pass" class="field" type="password" placeholder="Contraseña"><button class="btn btn-red" style="width:100%" onclick="doLogin()">Ingresar</button><br><br><p class="muted">Cliente: <b>cliente</b> / 1234<br>Admin: <b>admin</b> / 1234</p><br><a href="index.html">Volver al inicio</a></section></main><script>function doLogin(){let rol=document.getElementById('rol').value,u=document.getElementById('user').value,p=document.getElementById('pass').value;if((rol==='cliente'&&u==='cliente'&&p==='1234')||(rol==='admin'&&u==='admin'&&p==='1234')){localStorage.setItem('bp_user',JSON.stringify({username:u,rol}));location.href=rol==='cliente'?'cliente/inicio.html':'admin/presupuestos.html'}else alert('Usuario o contraseña incorrectos')}</script></body></html>
